---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  labels:
    grafana_dashboard: "true"
  disableNameSuffixHash: true
configMapGenerator:
  - name: grafana-dashboard.bare-metal.logs.system
    files: [./bare-metal.logs.system.json]

  - name: grafana-dashboard.bare-metal.views.nodes
    files: [./bare-metal.views.nodes.json]

  - name: grafana-dashboard.kubernetes.logs.events
    files: [./kubernetes.logs.events.json]

  - name: grafana-dashboard.kubernetes.logs.pods
    files: [./kubernetes.logs.pods.json]

  - name: grafana-dashboard.kubernetes.logs.system
    files: [./kubernetes.logs.system.json]

  - name: grafana-dashboard.kubernetes.system.api-server
    files: [./kubernetes.system.api-server.json]

  - name: grafana-dashboard.kubernetes.system.coredns
    files: [./kubernetes.system.coredns.json]

  - name: grafana-dashboard.kubernetes.views.global
    files: [./kubernetes.views.global.json]

  - name: grafana-dashboard.kubernetes.views.namespaces
    files: [./kubernetes.views.namespaces.json]

  - name: grafana-dashboard.kubernetes.views.nodes
    files: [./kubernetes.views.nodes.json]

  - name: grafana-dashboard.kubernetes.views.pods
    files: [./kubernetes.views.pods.json]

  - name: grafana-dashboard.proxmox.views.nodes
    files: [./proxmox.views.nodes.json]
