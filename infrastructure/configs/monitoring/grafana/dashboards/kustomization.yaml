---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  labels:
    grafana_dashboard: "true"
  disableNameSuffixHash: true
configMapGenerator:
  - name: grafana-dashboard-bare-metal_logs_system
    files: [./bare-metal_logs_system.json]

  - name: grafana-dashboard-bare-metal_views_nodes
    files: [./bare-metal_views_nodes.json]

  - name: grafana-dashboard-kubernetes_logs_events
    files: [./kubernetes_logs_events.json]

  - name: grafana-dashboard-kubernetes_logs_pods
    files: [./kubernetes_logs_pods.json]

  - name: grafana-dashboard-kubernetes_logs_system
    files: [./kubernetes_logs_system.json]

  - name: grafana-dashboard-kubernetes_system_api-server
    files: [./kubernetes_system_api-server.json]

  - name: grafana-dashboard-kubernetes_system_coredns
    files: [./kubernetes_system_coredns.json]

  - name: grafana-dashboard-kubernetes_views_global
    files: [./kubernetes_views_global.json]

  - name: grafana-dashboard-kubernetes_views_namespaces
    files: [./kubernetes_views_namespaces.json]

  - name: grafana-dashboard-kubernetes_views_nodes
    files: [./kubernetes_views_nodes.json]

  - name: grafana-dashboard-kubernetes_views_pods
    files: [./kubernetes_views_pods.json]

  - name: grafana-dashboard-proxmox_views_nodes
    files: [./proxmox_views_nodes.json]
