---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  labels:
    grafana_dashboard: "true"
  disableNameSuffixHash: true
configMapGenerator:
  - name: grafana-dashboards
    files:
      - ./kubernetes-pods.json
      - ./bare-metal_views_nodes.json
      - ./bare-metal_logs_system.json
      - ./kubernetes_logs_system.json
      - ./kubernetes_logs_events.json
