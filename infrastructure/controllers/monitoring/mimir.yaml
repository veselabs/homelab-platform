---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mimir
spec:
  chart:
    spec:
      version: 6.0.5
      chart: mimir-distributed
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: grafana
  interval: 1m0s
  values:
    minio:
      serviceAccount:
        # Both Mimir and Loki charts use `minio-sa` by default
        name: mimir-minio-sa

    mimir:
      persistence:
        size: 15Gi
      structuredConfig:
        limits:
          compactor_blocks_retention_period: 14d

    kafka:
      persistence:
        size: 15Gi
