---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  chart:
    spec:
      version: 10.3.1
      chart: grafana
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: grafana
  interval: 1m0s
  values:
    route:
      main:
        enabled: true
        parentRefs:
          - name: gateway
            namespace: kube-system
        hostnames: [grafana.homelab.veselabs.com]

    sidecar:
      alerts:
        enabled: true
      dashboards:
        enabled: true
      datasources:
        enabled: true
      plugins:
        enabled: true
      notifiers:
        enabled: true

  valuesFrom:
    - kind: Secret
      name: grafana-admin-user
      optional: true
      targetPath: adminUser
      valuesKey: username

    - kind: Secret
      name: grafana-admin-user
      optional: true
      targetPath: adminPassword
      valuesKey: password
