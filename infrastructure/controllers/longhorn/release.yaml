---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  chart:
    spec:
      version: 1.11.1
      chart: longhorn
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: longhorn
  interval: 1m0s
  values:
    httproute:
      enabled: true
      parentRefs:
        - name: gateway
          namespace: kube-system
      hostnames: [longhorn.homelab.veselabs.com]
    persistence:
      defaultClass: false
    defaultSettings:
      createDefaultDiskLabeledNodes: true
